name: Build & Publish Desktop Apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Dépendances Linux pour Tauri v2
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      # 1. Build Standard / Online (Linux, macOS, Windows Online)
      - name: Build Online Installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "App ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
            ${{ matrix.os == 'windows-latest' && '--config ''{"productName":"Tchik-Online","bundle":{"windows":{"webviewInstallMode":{"type":"downloadBootstrapper"}}}}''' || '' }}

      # 2. Build Offline spécifique pour Windows (avec suffixe Tchik-Offline)
      - name: Build Windows Offline Installer
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "App ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: '--config ''{"productName":"Tchik-Offline","bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}'''
